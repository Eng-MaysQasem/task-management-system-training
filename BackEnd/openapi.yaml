                  type: number
                  nullable: true
                in_progress:
                  type: number
                  nullable: true
                overdue:
                  type: number
                  nullable: true
            filters_applied:
              type: object
              properties:
                date_range:
                  type: object
                  nullable: true
                  properties:
                    from:
                      type: string
                    to:
                      type: string
                status:
                  type: string
                  nullable: true
                sprint_id:
                  type: string
                  nullable: true

