                type: object
                properties:
                  user_id:
                    type: string
                  name:
                    type: string
                  assigned:
                    type: integer
                  completed:
                    type: integer
                  in_progress:
                    type: integer
                  overdue:
                    type: integer
                  completion_rate:
                    type: number
            filters_applied:
              type: object
              properties:
                date_range:
                  type: object
                  nullable: true
                  properties:
                    from:
                      type: string
                    to:
                      type: string
                status:
                  type: string
                  nullable: true
                assignee_id:
                  type: string
                  nullable: true
                sprint_id:
                  type: string
                  nullable: true

    UserReportResponse:
      type: object
